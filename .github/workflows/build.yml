name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core behavior
        shell: powershell
        run: .\tests\Test-Core.ps1
      - name: Asset integrity
        shell: powershell
        run: .\tests\verify-assets.ps1
      - name: Build portable package
        shell: powershell
        run: .\build.ps1 -Package